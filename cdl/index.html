<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CDL Master Prep 2026</title>
  <meta name="description" content="US CDL exam prep — practice questions, pre-trip checklist, inspector Q&A and study topics in a polished offline PWA." />
  <meta name="theme-color" content="#0A0E1A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CDL Master Prep" />
  <meta name="mobile-web-app-capable" content="yes" />
  <base href="/pass-exam-usa/cdl/" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="pwa/apple-touch-icon.png" />
  <link rel="icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="pwa/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="pwa/icon-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ACCESS CHECK -->
  <script>
    (function() {
      // CDL is closed for now - no paid access links yet
      document.body.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0A0E1A;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:20px;">
          <div style="text-align:center;max-width:500px;">
            <div style="font-size:48px;margin-bottom:20px;">🔒</div>
            <h1 style="color:#fff;font-size:28px;margin-bottom:12px;font-weight:700;">Access Required</h1>
            <p style="color:#94A3B8;font-size:16px;line-height:1.6;margin-bottom:32px;">
              This is a premium product. Please purchase to receive your private access link.
            </p>
            <a href="https://dimaedwardsehk.github.io/pass-exam-usa/" style="display:inline-block;padding:14px 32px;background:linear-gradient(135deg,#E87C35,#F09050);color:#fff;border-radius:8px;text-decoration:none;font-weight:600;transition:all 0.3s;">
              Back to Store
            </a>
          </div>
        </div>
      `;
      document.documentElement.innerHTML = `<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Access Required - CDL Master Prep</title><style>body{margin:0;padding:0;background:#0A0E1A;}</style></head>${document.body.outerHTML}</html>`;
      throw new Error('Access denied');
    })();
  </script>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div class="flag-bg" aria-hidden="true">
    <svg id="flagSvg" class="flag-layer" viewBox="0 0 1900 1000" preserveAspectRatio="none">
      <defs>
        <filter id="flagWave" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence id="flagTurbulence" type="fractalNoise" baseFrequency="0.007 0.028" numOctaves="2" seed="7" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="44" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <linearGradient id="stripeSheen" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="rgba(255,255,255,.16)" />
          <stop offset=".48" stop-color="rgba(255,255,255,0)" />
          <stop offset="1" stop-color="rgba(0,0,0,.22)" />
        </linearGradient>
      </defs>
      <g id="flagFabric" filter="url(#flagWave)"></g>
    </svg>
    <div class="vignette"></div>
  </div>

  <main class="desktop-shell">
    <section class="phone-shell" aria-label="CDL Master Prep app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">CDL</div>
          <div>
            <div class="eyebrow">Pass Exam USA</div>
            <strong>Master Prep 2026</strong>
          </div>
        </div>
        <div class="lang-row" aria-label="Language helpers">
          <button class="lang active">EN</button>
          <button class="lang">RU</button>
          <button class="lang">ES</button>
          <button class="lang">PL</button>
        </div>
      </header>

      <div class="screen-scroll">
        <section id="home" class="screen active" data-screen="Home"></section>
        <section id="study" class="screen" data-screen="Study"></section>
        <section id="exam" class="screen" data-screen="Exam"></section>
        <section id="tools" class="screen" data-screen="Tools"></section>
        <section id="profile" class="screen" data-screen="Profile"></section>
      </div>

      <nav class="bottom-nav" aria-label="Primary navigation">
        <button class="nav-item active" data-tab="home"><span>🏠</span><small>Home</small></button>
        <button class="nav-item" data-tab="study"><span>📚</span><small>Study</small></button>
        <button class="nav-item" data-tab="exam"><span>📝</span><small>Exam</small></button>
        <button class="nav-item" data-tab="tools"><span>🛠️</span><small>Tools</small></button>
        <button class="nav-item" data-tab="profile"><span>👤</span><small>Profile</small></button>
      </nav>
    </section>
  </main>

  <script src="app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
