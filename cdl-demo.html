<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CDL Practice Test — Free 15 Questions | Pass Exam USA</title>
<meta name="description" content="Free 15-question CDL practice test with the toughest scenarios drivers miss: tire blowouts, hazmat, doubles, tankers. Translations in EN, RU, ES, PL.">
<link rel="canonical" href="https://dimaedwardsehk.github.io/pass-exam-usa/cdl-demo.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050A14;
    --card: rgba(14, 21, 37, 0.92);
    --card-2: rgba(19, 28, 48, 0.92);
    --border: #1E2B47;
    --gold: #E0B53F;
    --gold-2: #C99327;
    --gold-deep: #A87510;
    --text: #F4F6FB;
    --muted: #8B96AE;
    --dim: #5A6478;
    --good: #22C55E;
    --good-bg: rgba(15, 42, 26, .92);
    --bad: #EF4444;
    --bad-bg: rgba(42, 15, 18, .92);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ========= ANIMATED US FLAG — exact port from working Real Estate v3-mini ========= */
  .flag-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background: #050A14;
  }
  .flag-layer {
    position: absolute;
    transform-origin: center center;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 880px;
    margin: 0 auto;
    padding: 14px 22px 30px;
  }

  /* HEADER */
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .brand a { color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, var(--gold), var(--gold-deep));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #1a0e00; font-size: 17px;
    box-shadow: 0 6px 18px -6px rgba(224,181,63,.55);
  }
  .brand-name { font-weight: 800; font-size: 17px; letter-spacing: -0.01em; }
  .brand-sub { color: var(--muted); font-size: 12px; font-weight: 500; }

  .lang-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .lang-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 13px; border-radius: 999px;
    font-size: 12px; font-weight: 700; cursor: pointer;
    font-family: inherit; letter-spacing: 0.04em;
    transition: all .18s; backdrop-filter: blur(6px);
  }
  .lang-btn.active {
    background: linear-gradient(135deg, var(--gold), var(--gold-deep));
    color: #1a0e00; border-color: transparent;
  }
  .lang-btn:hover:not(.active) { color: var(--text); border-color: var(--gold); }

  /* HERO — minimal, just one line */
  .hero { margin: 0 0 14px; }
  .hero-title {
    font-size: clamp(24px, 4vw, 32px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0;
  }
  .hero-title .gold {
    background: linear-gradient(180deg, #fff 0%, var(--gold) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero-sub {
    color: var(--muted); margin: 6px 0 0;
    font-size: 13px; max-width: 600px;
  }

  /* META ROW */
  .meta-row {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 10px; font-weight: 700;
  }
  .meta-x {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px; font-family: inherit; line-height: 1;
  }
  .meta-x:hover { color: var(--text); border-color: var(--gold); }
  .meta-counter { color: var(--muted); font-size: 14px; }
  .meta-counter b { color: var(--text); }
  .meta-pill {
    display: inline-flex; align-items: center;
    background: rgba(224,181,63,.10);
    border: 1px solid rgba(224,181,63,.35);
    color: var(--gold);
    padding: 4px 10px; border-radius: 6px;
    font-size: 11px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.1em;
  }
  .meta-pts {
    margin-left: auto; color: var(--gold);
    font-size: 14px; font-weight: 800;
  }
  .progress-track {
    height: 4px; background: var(--card-2); border-radius: 999px;
    overflow: hidden; margin-bottom: 16px;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-deep), var(--gold));
    width: 0%;
    transition: width .45s cubic-bezier(.4,0,.2,1);
  }

  /* QUIZ CARD CONTAINER — sticky next button at bottom */
  .quiz-shell {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px 20px 16px;
    backdrop-filter: blur(8px);
    box-shadow: 0 30px 80px -30px rgba(0,0,0,.7), 0 0 0 1px rgba(224,181,63,.08);
  }

  .q-text {
    font-size: clamp(17px, 2.4vw, 20px);
    font-weight: 700; line-height: 1.35;
    margin: 0 0 12px; letter-spacing: -0.01em;
  }
  .hint-box {
    background: var(--card-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--gold);
    padding: 10px 13px;
    border-radius: 0 10px 10px 0;
    color: var(--muted); font-size: 13px;
    margin-bottom: 12px; display: none;
  }
  .hint-box.show { display: block; }

  /* OPTIONS — compact */
  .options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .option {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    background: var(--card-2);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 11px 14px;
    cursor: pointer; text-align: left;
    color: var(--text); font-size: 14.5px;
    line-height: 1.4;
    font-family: inherit;
    transition: all .15s ease;
  }
  .option:hover:not(:disabled) {
    border-color: var(--gold);
  }
  .option:disabled { cursor: default; }
  .opt-letter {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,.04);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px;
    border: 1px solid var(--border);
  }
  .opt-text { flex: 1; }
  .opt-icon {
    flex-shrink: 0;
    width: 24px; height: 24px;
    border-radius: 50%;
    display: none;
    align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 13px;
  }
  .option.correct {
    border-color: var(--good);
    background: var(--good-bg);
  }
  .option.correct .opt-letter { background: var(--good); border-color: var(--good); color: #fff; }
  .option.correct .opt-icon { display: flex; background: var(--good); }
  .option.wrong {
    border-color: var(--bad);
    background: var(--bad-bg);
  }
  .option.wrong .opt-letter { background: var(--bad); border-color: var(--bad); color: #fff; }
  .option.wrong .opt-icon { display: flex; background: var(--bad); }

  /* FEEDBACK — collapsible toggle so it doesn't push button off-screen */
  .feedback {
    margin: 0 0 12px;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback-header {
    padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none;
    gap: 10px;
  }
  .feedback-title {
    font-weight: 800; font-size: 14px;
    color: var(--gold); flex: 1;
  }
  .feedback.is-correct .feedback-title { color: var(--good); }
  .feedback-toggle {
    color: var(--muted); font-size: 12px; font-weight: 700;
    display: flex; align-items: center; gap: 6px;
  }
  .feedback-toggle::after {
    content: '▾'; transition: transform .2s;
  }
  .feedback.collapsed .feedback-toggle::after { transform: rotate(-90deg); }
  .feedback-body {
    padding: 0 14px 14px;
    font-size: 14px; line-height: 1.5;
    color: var(--text);
  }
  .feedback.collapsed .feedback-body { display: none; }
  .feedback-watch {
    margin-top: 10px;
    background: rgba(0,0,0,.2);
    border-left: 3px solid var(--gold);
    padding: 10px 12px;
    border-radius: 0 8px 8px 0;
  }
  .feedback-watch-title {
    color: var(--gold); font-weight: 800; font-size: 13px;
    display: flex; align-items: center; gap: 6px;
    margin: 0 0 4px;
  }
  .feedback-watch-title::before { content: '💡'; font-size: 14px; }
  .feedback-watch-text { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; }

  /* STICKY NEXT BUTTON */
  .next-btn {
    width: 100%;
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-2) 100%);
    color: #1a0e00;
    border: none; border-radius: 12px;
    padding: 14px 22px;
    font-size: 16px; font-weight: 800;
    cursor: pointer; font-family: inherit;
    letter-spacing: 0.01em;
    transition: transform .15s, filter .2s;
    box-shadow: 0 10px 28px -8px rgba(224,181,63,.4);
  }
  .next-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    filter: brightness(1.05);
  }
  .next-btn:disabled {
    background: var(--card-2);
    color: var(--dim);
    cursor: not-allowed;
    box-shadow: none;
  }

  /* RESULTS */
  .results-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 32px 24px;
    text-align: center;
    backdrop-filter: blur(8px);
  }
  .score-ring {
    position: relative; width: 180px; height: 180px;
    margin: 0 auto 14px;
  }
  .score-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .score-ring .ring-bg { stroke: rgba(255,255,255,.05); }
  .score-ring .ring-fg { stroke: url(#goldGrad); transition: stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1); }
  .score-num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .score-pct {
    font-size: 44px; font-weight: 800;
    background: linear-gradient(180deg, #fff, var(--gold));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1; letter-spacing: -0.02em;
  }
  .score-label { color: var(--muted); font-size: 13px; font-weight: 600; margin-top: 6px; }
  .score-correct { font-size: 32px; font-weight: 800; margin: 6px 0 4px; color: var(--text); }
  .score-correct-label { color: var(--muted); font-size: 13px; font-weight: 600; }
  .score-verdict { color: var(--text); font-size: 15px; font-weight: 600; margin-top: 14px; }

  .cta-box {
    margin-top: 22px;
    background: var(--card-2);
    border: 1.5px solid var(--gold);
    border-radius: 16px;
    padding: 22px;
    text-align: left;
    box-shadow: 0 0 0 1px rgba(224,181,63,.2), 0 16px 40px -16px rgba(224,181,63,.3);
  }
  .cta-box h3 {
    margin: 0 0 12px; font-size: 20px; font-weight: 800;
    background: linear-gradient(180deg, #fff, var(--gold));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .cta-list { list-style: none; margin: 0 0 16px; padding: 0; }
  .cta-list li {
    padding: 6px 0 6px 26px; position: relative;
    font-size: 14px; color: var(--text);
  }
  .cta-list li::before {
    content: '✓'; position: absolute; left: 0; top: 6px;
    width: 18px; height: 18px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--gold-deep));
    color: #1a0e00; font-weight: 900; font-size: 11px;
    display: flex; align-items: center; justify-content: center;
  }
  .cta-price-row {
    display: flex; align-items: baseline; gap: 10px;
    margin: 14px 0 12px; flex-wrap: wrap;
  }
  .cta-price { font-size: 30px; font-weight: 800; color: var(--gold); letter-spacing: -0.02em; }
  .cta-price-sub { color: var(--muted); font-size: 13px; }
  .cta-btn {
    display: block;
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-2) 100%);
    color: #1a0e00;
    padding: 14px 22px;
    border-radius: 12px;
    font-weight: 800; font-size: 16px;
    text-decoration: none; text-align: center;
    box-shadow: 0 10px 28px -8px rgba(224,181,63,.5);
  }
  .restart-btn {
    margin-top: 12px; background: transparent;
    color: var(--muted); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 18px;
    font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .restart-btn:hover { color: var(--text); border-color: var(--gold); }

  footer {
    text-align: center; color: var(--muted);
    font-size: 12px; margin-top: 22px;
  }
  footer a { color: var(--gold); text-decoration: none; font-weight: 600; }

  /* ========= APK SHELL: TOPICS RAIL, TOOLS GRID, BOTTOM NAV, TOAST ========= */

  /* Topics rail — горизонтальный скролл сразу под флагом-вверху */
  .topics-rail {
    margin: 0 0 16px;
    display: flex;
    gap: 10px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 6px 2px 12px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .topics-rail::-webkit-scrollbar { display: none; }
  .topic-chip {
    flex: 0 0 auto;
    background: var(--card-2);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 10px 14px;
    display: flex; align-items: center; gap: 10px;
    cursor: pointer;
    color: var(--muted);
    font-family: inherit;
    font-size: 13px; font-weight: 700;
    transition: all .15s ease;
    backdrop-filter: blur(6px);
    position: relative;
    min-width: 130px;
  }
  .topic-chip:hover { border-color: var(--gold); color: var(--text); transform: translateY(-1px); }
  .topic-chip .topic-emoji { font-size: 20px; line-height: 1; }
  .topic-chip .topic-name { white-space: nowrap; }
  .topic-chip .topic-lock {
    margin-left: auto;
    font-size: 11px;
    color: var(--gold);
    opacity: 0.6;
  }

  /* Tools grid — карточки внизу страницы */
  .tools-section {
    margin-top: 22px;
  }
  .tools-title {
    font-size: 18px; font-weight: 800;
    margin: 0 0 12px;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .tools-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
  .tool-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 12px;
    text-align: center;
    cursor: pointer;
    transition: all .15s ease;
    backdrop-filter: blur(6px);
    position: relative;
    font-family: inherit;
    color: var(--text);
  }
  .tool-card:hover {
    border-color: var(--gold);
    transform: translateY(-2px);
  }
  .tool-card .tool-emoji {
    font-size: 28px;
    margin-bottom: 6px;
    display: block;
  }
  .tool-card .tool-label {
    font-size: 12px;
    font-weight: 700;
    line-height: 1.25;
    color: var(--text);
  }
  .tool-card .tool-sub {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
  }
  .tool-card .tool-lock {
    position: absolute;
    top: 8px; right: 8px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(224,181,63,0.15);
    border: 1px solid rgba(224,181,63,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px;
    color: var(--gold);
  }

  /* Bottom navigation — закреплённый снизу, как в APK */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 5;
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: rgba(8, 13, 27, 0.92);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(16px);
    padding: 8px env(safe-area-inset-right, 0) calc(8px + env(safe-area-inset-bottom, 0)) env(safe-area-inset-left, 0);
  }
  .nav-item {
    flex: 1;
    background: transparent;
    border: none;
    padding: 8px 4px;
    color: var(--muted);
    font-family: inherit;
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    transition: color .15s;
    position: relative;
  }
  .nav-item .nav-emoji { font-size: 20px; line-height: 1; opacity: 0.65; transition: opacity .15s, transform .15s; }
  .nav-item.active { color: var(--gold); }
  .nav-item.active .nav-emoji { opacity: 1; transform: scale(1.1); }
  .nav-item:hover:not(.active) { color: var(--text); }
  .nav-item:hover:not(.active) .nav-emoji { opacity: 0.9; }
  .nav-item .nav-lock {
    position: absolute;
    top: 4px; right: 50%;
    transform: translateX(16px);
    font-size: 8px;
    color: var(--gold);
    opacity: 0.5;
  }

  /* Toast — золотая сноска снизу */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 84px;
    transform: translateX(-50%) translateY(20px);
    background: linear-gradient(180deg, var(--gold), var(--gold-2));
    color: #1a0e00;
    padding: 12px 22px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 14px;
    box-shadow: 0 10px 30px -8px rgba(224,181,63,.5), 0 0 0 1px rgba(255,255,255,0.15) inset;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Bottom padding so content doesn't hide behind nav */
  body { padding-bottom: 70px; }

  @media (max-width: 720px) {
    .tools-grid { grid-template-columns: repeat(3, 1fr); }
    .tool-card { padding: 14px 8px; }
    .tool-card .tool-emoji { font-size: 24px; }
  }
  @media (max-width: 480px) {
    .container { padding: 16px 12px 24px; }
    .quiz-shell { padding: 16px 14px 14px; }
    .options { gap: 7px; }
    .option { padding: 10px 12px; font-size: 14px; }
    .opt-letter { width: 28px; height: 28px; font-size: 12px; }
    .next-btn { padding: 13px; font-size: 15px; }
    .score-ring { width: 150px; height: 150px; }
    .topic-chip { min-width: 110px; padding: 8px 12px; font-size: 12px; }
    .tools-grid { grid-template-columns: repeat(2, 1fr); }
    .nav-item { font-size: 9px; }
    .nav-item .nav-emoji { font-size: 18px; }
  }
</style>
</head>
<body>

<!-- ========= ANIMATED US FLAG ========= -->
<div class="flag-bg" id="bg-wrap" aria-hidden="true"></div>

<div class="container">

  <div class="top-bar">
    <div class="brand">
      <a href="index.html">
        <div class="brand-mark">PE</div>
        <div>
          <div class="brand-name">Pass Exam USA</div>
          <div class="brand-sub">CDL · Real Estate · DMV</div>
        </div>
      </a>
    </div>
    <div class="lang-row" id="langRow">
      <button class="lang-btn active" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="ru">RU</button>
      <button class="lang-btn" data-lang="es">ES</button>
      <button class="lang-btn" data-lang="pl">PL</button>
    </div>
  </div>

  <div class="hero">
    <h1 class="hero-title"><span class="gold">Free CDL Practice</span></h1>
  </div>

  <!-- TOPICS RAIL — все 11 тем из APK, кликаются с тостом -->
  <div class="topics-rail" id="topicsRail"></div>

  <div id="quizArea"></div>
  <div id="resultsArea" style="display:none;"></div>

  <!-- TOOLS — карточки как в Tools-экране APK -->
  <section class="tools-section">
    <h2 class="tools-title">Tools</h2>
    <div class="tools-grid" id="toolsGrid"></div>
  </section>

  <footer></footer>
</div>

<!-- BOTTOM NAVIGATION (как в APK) -->
<nav class="bottom-nav" id="bottomNav"></nav>

<!-- TOAST -->
<div class="toast" id="toast">🔒 Available in full version — $9.99</div>

<script>
/* =========================================================================
   ANIMATED US FLAG — direct port from the working Real Estate v3-mini.
   Identical math, identical RAF throttle (every 3rd frame), identical colors.
   ========================================================================= */
(function initFlag() {
  const COLORS = { red:'#4A1520', white:'#5A544D', blue:'#0A1220' };
  const STRIPE_COUNT = 13;
  const ROTATION = '-35deg';

  function buildFlag() {
    const SW = window.innerWidth, SH = window.innerHeight;
    const diagonal = Math.sqrt(SW*SW + SH*SH);
    const FLAG_W = diagonal * 1.4;
    const FLAG_H = FLAG_W / 1.9;
    const STRIPE_H = FLAG_H / STRIPE_COUNT;
    const CANTON_H = STRIPE_H * 7;
    const CANTON_W = FLAG_W * 0.4;
    const bottomOffset = -diagonal * 0.28;
    const leftOffset = -diagonal * 0.32;

    const stars = [];
    const cols=9, rows=7, sx=CANTON_W/(cols+1), sy=CANTON_H/(rows+1);
    for(let r=1;r<=rows;r++) for(let c=1;c<=cols;c++){
      if(r%2===0 && c>cols-1) continue;
      const x = c*sx + (r%2===0 ? sx*0.5 : 0);
      const y = r*sy;
      const sz = STRIPE_H*0.3;
      const cx=x, cy=y;
      stars.push(`<path d="M ${cx} ${cy-sz} L ${cx+sz*0.22} ${cy-sz*0.22} L ${cx+sz*0.95} ${cy-sz*0.31} L ${cx+sz*0.44} ${cy+sz*0.22} L ${cx+sz*0.59} ${cy+sz*0.9} L ${cx} ${cy+sz*0.5} L ${cx-sz*0.59} ${cy+sz*0.9} L ${cx-sz*0.44} ${cy+sz*0.22} L ${cx-sz*0.95} ${cy-sz*0.31} L ${cx-sz*0.22} ${cy-sz*0.22} Z" fill="#FFFFFF" opacity="0.25"/>`);
    }

    let stripes = '';
    for(let i=0;i<STRIPE_COUNT;i++){
      stripes += `<rect x="0" y="${i*STRIPE_H}" width="${FLAG_W}" height="${STRIPE_H+0.5}" fill="${i%2===0?COLORS.red:COLORS.white}"/>`;
    }

    const wrap = document.getElementById('bg-wrap');
    wrap.innerHTML = `
      <div class="flag-layer" style="bottom:${bottomOffset}px;left:${leftOffset}px;width:${FLAG_W}px;height:${FLAG_H}px;transform:rotate(${ROTATION})">
        <svg width="${FLAG_W}" height="${FLAG_H}" viewBox="0 0 ${FLAG_W} ${FLAG_H}" style="overflow:visible">
          <defs>
            <filter id="flag-wave" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence id="ft" type="fractalNoise" baseFrequency="0.00275 0.00525" numOctaves="2" seed="5" result="turbulence"/>
              <feDisplacementMap id="fd" in="SourceGraphic" in2="turbulence" scale="80" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
          </defs>
          <g filter="url(#flag-wave)">
            ${stripes}
            <rect x="0" y="0" width="${CANTON_W}" height="${CANTON_H}" fill="${COLORS.blue}"/>
            ${stars.join('')}
          </g>
        </svg>
      </div>
    `;

    const ft = document.getElementById('ft');
    const fd = document.getElementById('fd');
    const startTime = performance.now();
    const TURB_DUR = 32000, DISP_DUR = 24000;
    let frameCount = 0;

    function animate() {
      frameCount++;
      if (frameCount % 3 === 0) {
        const elapsed = performance.now() - startTime;
        const turbSin = Math.sin((elapsed%TURB_DUR)/TURB_DUR * Math.PI*2);
        const freqX = 0.00275 + 0.00075*turbSin;
        const freqY = 0.00525 + 0.00125*turbSin;
        if(ft) ft.setAttribute('baseFrequency', freqX.toFixed(5)+' '+freqY.toFixed(5));
        const dispSin = Math.sin((elapsed%DISP_DUR)/DISP_DUR * Math.PI*2);
        const scale = 80 + 5*dispSin;
        if(fd) fd.setAttribute('scale', scale.toFixed(1));
      }
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  }

  buildFlag();
  window.addEventListener('resize', buildFlag);
})();

/* =========================================================================
   QUIZ
   ========================================================================= */
const FALLBACK_LANG = 'en';
let HINT_LANG = 'en';
let questions = [];
let current = 0;
let correctCount = 0;
let answered = false;
let feedbackCollapsed = false;

const TOPIC_LABELS = {
  'emergencies': 'EMERGENCIES',
  'hazmat': 'HAZMAT',
  'doubles-triples': 'DOUBLES & TRIPLES',
  'tankers': 'TANKERS',
  'combination-vehicles': 'COMBINATION',
  'pre-trip-inspection': 'PRE-TRIP',
  'safe-driving': 'SAFE DRIVING',
  'cargo': 'CARGO',
  'passengers': 'PASSENGERS',
  'general-knowledge': 'GENERAL',
  'air-brakes': 'AIR BRAKES'
};

function tx(obj, lang) {
  if (!obj) return '';
  if (typeof obj === 'string') return obj;
  return obj[lang] || obj[FALLBACK_LANG] || Object.values(obj)[0] || '';
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function setProgress(idx) {
  const pct = (idx / questions.length) * 100;
  const bar = document.getElementById('progressBar');
  if (bar) bar.style.width = pct + '%';
}

function renderQuestion() {
  const q = questions[current];
  if (!q) { renderResults(); return; }
  answered = false;
  feedbackCollapsed = false;

  const topic = TOPIC_LABELS[q.topicId] || q.topicId.toUpperCase();
  const en = tx(q.text, 'en');
  const hint = HINT_LANG !== 'en' ? tx(q.text, HINT_LANG) : '';

  let html = '';
  html += '<div class="meta-row">';
  html += '<button class="meta-x" type="button" onclick="window.location.href=\'index.html\'">×</button>';
  html += '<span class="meta-counter"><b>' + (current + 1) + '</b>/' + questions.length + '</span>';
  html += '<span class="meta-pill">' + escapeHtml(topic) + '</span>';
  html += '<span class="meta-pts">' + (correctCount * 10) + ' pts</span>';
  html += '</div>';
  html += '<div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>';
  html += '<div class="quiz-shell">';
  html += '<div class="q-text">' + escapeHtml(en) + '</div>';
  if (hint && hint !== en) html += '<div class="hint-box show">' + escapeHtml(hint) + '</div>';
  html += '<div class="options">';
  for (const opt of q.options) {
    const optEn = tx(opt.text, 'en');
    html += '<button class="option" data-id="' + opt.id + '" type="button">';
    html += '<span class="opt-letter">' + opt.id + '</span>';
    html += '<span class="opt-text">' + escapeHtml(optEn) + '</span>';
    html += '<span class="opt-icon"></span>';
    html += '</button>';
  }
  html += '</div>';
  html += '<div class="feedback" id="feedbackBox">';
  html += '<div class="feedback-header" id="feedbackHeader">';
  html += '<span class="feedback-title" id="feedbackTitle"></span>';
  html += '<span class="feedback-toggle">why</span>';
  html += '</div>';
  html += '<div class="feedback-body">';
  html += '<div id="feedbackText"></div>';
  html += '<div class="feedback-watch" id="feedbackWatch" style="display:none;">';
  html += '<div class="feedback-watch-title">Watch Out:</div>';
  html += '<div class="feedback-watch-text" id="feedbackWatchText"></div>';
  html += '</div>';
  html += '</div>';
  html += '</div>';
  html += '<button class="next-btn" id="nextBtn" disabled>Select an answer</button>';
  html += '</div>';

  document.getElementById('quizArea').innerHTML = html;
  setProgress(current);

  document.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', () => onAnswer(btn.dataset.id));
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    current++;
    renderQuestion();
    // Scroll to top so next question is visible without scrolling
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  // Feedback collapse toggle
  const fbHeader = document.getElementById('feedbackHeader');
  if (fbHeader) {
    fbHeader.addEventListener('click', () => {
      const fb = document.getElementById('feedbackBox');
      feedbackCollapsed = !feedbackCollapsed;
      fb.classList.toggle('collapsed', feedbackCollapsed);
    });
  }
}

function onAnswer(chosenId) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const correct = q.correctAnswer;
  const wasCorrect = chosenId === correct;
  if (wasCorrect) correctCount++;

  document.querySelectorAll('.option').forEach(btn => {
    btn.disabled = true;
    if (btn.dataset.id === correct) {
      btn.classList.add('correct');
      const icon = btn.querySelector('.opt-icon');
      if (icon) icon.textContent = '✓';
    }
    if (btn.dataset.id === chosenId && !wasCorrect) {
      btn.classList.add('wrong');
      const icon = btn.querySelector('.opt-icon');
      if (icon) icon.textContent = '✕';
    }
  });

  const pts = document.querySelector('.meta-pts');
  if (pts) pts.textContent = (correctCount * 10) + ' pts';

  const fb = document.getElementById('feedbackBox');
  const fbTitle = document.getElementById('feedbackTitle');
  const fbText = document.getElementById('feedbackText');
  const fbWatch = document.getElementById('feedbackWatch');
  const fbWatchText = document.getElementById('feedbackWatchText');
  fb.classList.add('show');
  fb.classList.toggle('is-correct', wasCorrect);

  // Auto-collapse "why" if correct, expand if wrong
  feedbackCollapsed = wasCorrect;
  fb.classList.toggle('collapsed', feedbackCollapsed);

  fbTitle.textContent = wasCorrect ? '✓ Correct — tap "why" to see the explanation' : '✕ Incorrect — Here\u2019s Why';
  fbText.textContent = tx(q.explanation, 'en');

  const hintExp = HINT_LANG !== 'en' ? tx(q.explanation, HINT_LANG) : '';
  if (hintExp && hintExp !== fbText.textContent) {
    fbWatch.style.display = 'block';
    fbWatchText.textContent = hintExp;
  } else {
    fbWatch.style.display = 'none';
  }

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = false;
  nextBtn.textContent = current === questions.length - 1 ? 'See Results →' : 'Next Question →';

  // Auto-scroll button into view smoothly (no need to drag)
  setTimeout(() => {
    nextBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 50);
}

function renderResults() {
  document.getElementById('quizArea').style.display = 'none';
  const area = document.getElementById('resultsArea');
  area.style.display = 'block';

  const pct = Math.round((correctCount / questions.length) * 100);
  let verdict = '';
  if (pct >= 80) verdict = 'Strong result. Lock it in with the full test.';
  else if (pct >= 60) verdict = 'On track. Polish the weak areas.';
  else verdict = 'Drill the basics before exam day.';

  const radius = 78;
  const circumference = 2 * Math.PI * radius;
  const offset = circumference * (1 - correctCount / questions.length);

  area.innerHTML = ''
    + '<div class="results-card">'
      + '<div class="score-ring">'
        + '<svg viewBox="0 0 180 180">'
          + '<defs><linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">'
            + '<stop offset="0%" stop-color="#E0B53F"/>'
            + '<stop offset="100%" stop-color="#A87510"/>'
          + '</linearGradient></defs>'
          + '<circle class="ring-bg" cx="90" cy="90" r="' + radius + '" fill="none" stroke-width="10"/>'
          + '<circle class="ring-fg" cx="90" cy="90" r="' + radius + '" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + circumference + '" stroke-dashoffset="' + circumference + '" id="ringFg"/>'
        + '</svg>'
        + '<div class="score-num">'
          + '<div class="score-pct">' + pct + '%</div>'
          + '<div class="score-label">Ready</div>'
        + '</div>'
      + '</div>'
      + '<div class="score-correct">' + correctCount + ' / ' + questions.length + '</div>'
      + '<div class="score-correct-label">Answered correctly</div>'
      + '<div class="score-verdict">' + verdict + '</div>'
      + '<div class="cta-box">'
        + '<h3>Get the full CDL Master Prep</h3>'
        + '<ul class="cta-list">'
          + '<li>200 real exam questions across 11 official topics</li>'
          + '<li>Hint translations: English, Russian, Spanish, Polish</li>'
          + '<li>Pre-trip inspection drills, common mistakes, road signs</li>'
          + '<li>Full vocabulary and explanations from CDL Manual</li>'
          + '<li>Works fully offline — no signal needed</li>'
          + '<li>Lifetime access, no subscription</li>'
        + '</ul>'
        + '<div class="cta-price-row">'
          + '<div class="cta-price">$9.99</div>'
          + '<div class="cta-price-sub">one-time payment · lifetime access</div>'
        + '</div>'
        + '<a class="cta-btn" href="index.html#cdl">Get Full CDL Prep →</a>'
      + '</div>'
      + '<button class="restart-btn" id="restartBtn">Restart Demo</button>'
    + '</div>';

  requestAnimationFrame(() => {
    setTimeout(() => {
      const ring = document.getElementById('ringFg');
      if (ring) ring.style.strokeDashoffset = offset;
    }, 100);
  });

  document.getElementById('restartBtn').addEventListener('click', () => {
    current = 0; correctCount = 0;
    document.getElementById('quizArea').style.display = '';
    area.style.display = 'none';
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

document.getElementById('langRow').addEventListener('click', (e) => {
  if (!e.target.dataset.lang) return;
  HINT_LANG = e.target.dataset.lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === HINT_LANG));
  if (document.getElementById('resultsArea').style.display !== 'block' && questions.length) {
    renderQuestion();
  }
});

fetch('data/cdl_demo_questions.json')
  .then(r => r.json())
  .then(data => {
    questions = data;
    renderQuestion();
  })
  .catch(err => {
    document.getElementById('quizArea').innerHTML = '<div class="results-card"><p style="color:var(--muted);">Could not load questions. Please refresh the page.</p></div>';
    console.error(err);
  });

    { emoji: '🔍',  name: 'Pre-Trip Inspection' },
    { emoji: '🛡️', name: 'Safe Driving' },
    { emoji: '🚨',  name: 'Emergencies' },
    { emoji: '📦',  name: 'Cargo & Weight' },
    { emoji: '🚛',  name: 'Doubles & Triples' },

  // 5 инструментов из ToolsScreen.tsx
  const TOOLS = [
    { emoji: '🔧',  label: 'Pre-Trip Checklist',  sub: '10 zones · 35 checks' },
    { emoji: '🧑‍✈️', label: 'Inspector Simulator', sub: '20 Q&A flashcards' },
    { emoji: '📖',  label: 'CDL Vocabulary',      sub: '4-language hints' },
    { emoji: '🚧',  label: 'Road Signs',           sub: 'Shapes · colors · meaning' },
    { emoji: '⚠️',  label: 'Common Mistakes',      sub: 'What examiners fail you for' },
  ];

  // Bottom navigation 5 пунктов из TabsNavigator.tsx
  const NAV = [
    { emoji: '🏠',  label: 'Home',    active: true,  free: true  },
    { emoji: '📚',  label: 'Study',   active: false, free: false },
    { emoji: '📝',  label: 'Exam',    active: false, free: false },
    { emoji: '🛠️', label: 'Tools',   active: false, free: false },
    { emoji: '👤',  label: 'Profile', active: false, free: false },
  ];

  // Render Topics rail
  const rail = document.getElementById('topicsRail');
  if (rail) {
    rail.innerHTML = TOPICS.map(t => (
      '<button class="topic-chip" type="button" data-locked="1">' +
        '<span class="topic-emoji">' + t.emoji + '</span>' +
        '<span class="topic-name">' + t.name + '</span>' +
        '<span class="topic-lock">🔒</span>' +
      '</button>'
    )).join('');
    rail.querySelectorAll('.topic-chip').forEach(chip => {
      chip.addEventListener('click', () => showLockToast());
    });
  }

  // Render Tools grid
  const tools = document.getElementById('toolsGrid');
  if (tools) {
    tools.innerHTML = TOOLS.map(t => (
      '<button class="tool-card" type="button" data-locked="1">' +
        '<span class="tool-lock">🔒</span>' +
        '<span class="tool-emoji">' + t.emoji + '</span>' +
        '<span class="tool-label">' + t.label + '</span>' +
        '<span class="tool-sub">' + t.sub + '</span>' +
      '</button>'
    )).join('');
    tools.querySelectorAll('.tool-card').forEach(card => {
      card.addEventListener('click', () => showLockToast());
    });
  }

  // Render Bottom nav
  const nav = document.getElementById('bottomNav');
  if (nav) {
    nav.innerHTML = NAV.map(n => (
      '<button class="nav-item' + (n.active ? ' active' : '') + '" type="button" data-free="' + (n.free ? '1' : '0') + '">' +
        '<span class="nav-emoji">' + n.emoji + '</span>' +
        '<span>' + n.label + '</span>' +
        (n.free ? '' : '<span class="nav-lock">🔒</span>') +
      '</button>'
    )).join('');
    nav.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        if (item.dataset.free === '1') {
          // Home — already here, scroll to top
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          showLockToast();
        }
      });
    });
  }

  // Toast logic
  let toastTimer = null;
  function showLockToast() {
    const toast = document.getElementById('toast');
    if (!toast) return;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, 2500);
  }
  // Expose for any other handler
  window.__showLockToast = showLockToast;
})();
