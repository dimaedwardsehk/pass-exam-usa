  <meta name="theme-color" content="#050A14" />

<!-- ANIMATED US FLAG -->

      <div class="brand">
        <a href="https://dimaedwardsehk.github.io/pass-exam-usa/">

      <div class="badge-dl">Driver's License</div>

    <svg width="0" height="0" style="position:absolute">
      <defs>
        <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#60A5FA"/>
          <stop offset="100%" stop-color="#1D4ED8"/>

          <stop offset="100%" stop-color="#1D4ED8"/>

    <!-- SCREENS -->
    <div id="screenHome" class="screen active"></div>
    <div id="screenStudy" class="screen"></div>
    <div id="screenExam" class="screen"></div>
    <div id="screenTools" class="screen"></div>
    <div id="screenProfile" class="screen"></div>

<!-- BOTTOM NAVIGATION -->
